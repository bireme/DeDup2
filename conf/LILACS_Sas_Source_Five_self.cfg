    }
  },

  "comparators" : [
    {
      "exact" : {
        "fieldName" : "issn",
        "normalize" : false
      }
    },
    {
      "exact" : {
        "fieldName" : "volume_serial",
        "normalize" : false
      }
    },
    {
      "exact" : {
        "fieldName" : "issue_number",
        "normalize" : false
      }
    },
    {
      "regex" : {
        "fieldName" : "publication_year",
        "normalize" : true,
        "regex" : "(\\d\\d\\d\\d)",
        "compString": "$1"
      }
    }
  ],

  "reporters" : [
    {
      "pipe" : {
        "file" : "selfCheck/LILACS_SAS_Source//LILACS_SAS_Source_Five.txt",
