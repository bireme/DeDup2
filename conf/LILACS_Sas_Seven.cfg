{
  "producer" : {
    "lucene": {
      "index": "indexes/LILACS_Sas",
      "search": "title:\"Prevention of median incisional hernia in the rat by ultrasonic therapy\"",
      "fields": ["id", "title", "title_serial", "publication_year", "volume_serial", "issue_number", "author", "pages"]
    }
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/LILACS_Sas",
      "searchField": "title",
      "minSimilarity" : 0.85
    }
  },

  "comparators" : [
    {
      "levenshteinJaccard" : {
        "fieldName" : "title_serial",
        "normalize" : true,
        "minSimilarity" : 0.8
      }
    },
    {
      "exact" : {
        "fieldName" : "publication_year",
        "normalize" : true
      }
    },
    {
      "exact" : {
        "fieldName" : "volume_serial",
        "normalize" : false
      }
    },
    {
      "exact" : {
        "fieldName" : "issue_number",
        "normalize" : false
      }
    },
    {
      "authors" : {
        "fieldName" : "author"
      }
    },
    {
      "regex" : {
        "fieldName" : "pages",
        "normalize" : true,
        "regex" : "e?(\\d+)",
        "compString": "$1"
      }
    }
  ],

  "heuristic": "LilacsSasHeuristic",

  "reporters": [
    {
      "console": {
        "minTrue": 2
      }
    }
  ]
}
