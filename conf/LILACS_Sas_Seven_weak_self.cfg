{
  "producer" : {
    "mysql" : {
      "host" : "osmio11.bireme.br",
      "port" : 6612,
      "dbnm" : "fi_admin",
      "user" : "acesso_fiadmin",
      "pswd" : "fi_admin@BIR202309",
      "sqlfs" : ["sqls/LILACS_Sas.sql","sqls/LILACS_Sas_ingles.sql"],
      "splitDocumentField" : "title",
      "sqlfs_only_english" : ["sql/LILACS_Sas_ingles.sql"],
      "jsonFieldFile" : "conf/jsonFields.txt"
    }
  },

  "selfCheckDuplicated": {
    "outCsvFile": "csv/LILACS_Sas_seven_weak.csv",
    "index": "indexes/LILACS_Sas_weak",
    "encoding": "utf-8"
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/LILACS_Sas_weak",
      "searchField": "title",
      "minSimilarity" : 0.8
    }
  },

  "comparators" : [
    {
      "levenshteinJaccard" : {
        "fieldName" : "title_serial",
        "normalize" : true,
        "minSimilarity" : 0.5
      }
    },
    {
      "number" : {
        "fieldName" : "volume_serial"
      }
    },
    {
      "number" : {
        "fieldName" : "issue_number"
      }
    },
    {
      "authors" : {
        "fieldName" : "author"
      }
    },
    {
      "regex" : {
        "fieldName" : "pages",
        "normalize" : true,
        "regex" : "e?0*(\\d+)",
        "compString": "$1"
      }
    },
    {
      "urls": {
        "fieldName": "electronic_address"
      }
    }
  ],

  "heuristic": "LilacsSasHeuristicWeak",

  "reporters" : [
    {
      "pipe" : {
        "file" : "selfCheck/LILACS_SAS/LILACS_Sas_Seven_weak.txt",
        "encoding": "utf-8",
        "recordSeparator" : "|",
        "putHeader" : true,
        "flushResults" : true,
        "minTrue" : 4
      }
    },
    {
      "mongoDB": {
        "database" : "DeDup2",
        "collection" : "LILACS_Sas_Seven_weak",
        "append" : false,
        "host" : "172.17.1.230",
        "port" : 27017,
        "minTrue" : 4,
        "flushResults" : true
      }
    }
  ]
}
