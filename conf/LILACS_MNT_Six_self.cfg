{
   "producer" : {
      "mysql" : {
        "host" : "osmio11.bireme.br",
        "port" : 6612,
        "dbnm" : "fi_admin",
        "user" : "acesso_fiadmin",
        "pswd" : "fi_admin@BIR202309",
        "sqlfs" : ["sqls/LILACS_MNT.sql","sqls/LILACS_MNT_ingles.sql"],
        "jsonFieldFile" : "conf/jsonFields.txt"
      }
   },

    "selfCheckDuplicated": {
        "outCsvFile": "csv/LILACS_MNT.csv",
        "index": "indexes/LILACS_MNT",
        "encoding": "utf-8"
    },

    "finder" : {
        "lucene" : {
            "index": "indexes/LILACS_MNT",
            "searchField": "title_monographic",
            "minSimilarity" : 0.4
         }
    },

    "comparators" : [
      {
        "exact" : {
          "fieldName" : "publication_year",
          "normalize" : true
        }
      },
      {
        "authors" : {
            "fieldName" : "author"
        }
      },
      {
        "regex" : {
          "fieldName" : "pages_monographic",
          "normalize" : true,
          "regex" : "e?(\\d+)",
          "compString": "$1"
        }
      },
      {
        "exact" : {
          "fieldName" : "volume_serial",
          "normalize" : false
        }
      },
      {
        "exact" : {
          "fieldName" : "issue_number",
          "normalize" : false
        }
      }
    ],

    "reporters" : [
      {
        "pipe" : {
          "file" : "selfCheck/LILACS_MNT/LILACS_MNT_Six.txt",
          "encoding": "utf-8",
          "recordSeparator" : "|",
          "putHeader" : true,
          "flushResults" : true,
          "minTrue" : 4
        }
      },
      {
        "mongoDB": {
          "database" : "DeDup2",
          "collection" : "LILACS_MNT_Six",
          "append" : false,
          "host" : "172.17.1.230",
          "port" : 27017,
          "minTrue" : 4,
          "flushResults" : true
        }
      }
   ]
}
