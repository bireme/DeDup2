      "sqlfs" : ["sqls/DIREV.sql"],
      "splitDocumentField" : "title",
      "jsonFieldFile" : "conf/jsonFields.txt"
    }
  },

  "selfCheckDuplicated": {
    "outCsvFile": "csv/DIREV.csv",
    "index": "indexes/DIREV",
    "encoding": "utf-8"
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/DIREV",
      "searchField": "title",
      "minSimilarity" : 0.7
    }
  },

  "comparators" : [
    {
      "regex" : {
        "fieldName" : "start_date",
        "normalize" : true,
        "regex" : "(\\d\\d\\d\\d-\\d\\d-\\d\\d)",
        "compString": "$1"
      }
    },
    {
      "exact" : {
        "fieldName" : "link",
        "normalize" : true
      }
    }
  ],

  "heuristic": "DirevHeuristic",

  "reporters" : [
    {
      "pipe" : {
        "file" : "selfCheck/DIREV/DIREV_Three.txt",
        "encoding": "utf-8",
        "recordSeparator" : "|",
        "putHeader" : true,
        "minTrue" : 3,
        "flushResults" : true
      }
    },
    {
      "mongoDB": {
      "database" : "DeDup2",
      "collection" : "DIREV_Three",
      "append" : false,
      "host" : "172.17.1.230",
      "port" : 27017,
      "minTrue" : 3,
      "flushResults" : true
      }
    }
  ]
}
