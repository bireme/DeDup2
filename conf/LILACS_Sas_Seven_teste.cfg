{
  "producer" : {
    "csv": {
      "file": "bug.txt",
      "schema" : "file=csv_schema/LILACS_seven.txt",
      "hasHeader": "false",
      "fieldSeparator": ",",
      "encoding": "utf-8"
    }
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/LILACS_Sas_weak",
      "searchField": "title",
      "minSimilarity" : 0.8
    }
  },

  "comparators" : [
    {
      "levenshteinJaccard" : {
        "fieldName" : "title_serial",
        "normalize" : true,
        "minSimilarity" : 0.8
      }
    },
    {
      "exact" : {
        "fieldName" : "publication_year",
        "normalize" : true
      }
    },
    {
      "exact" : {
        "fieldName" : "volume_serial",
        "normalize" : false
      }
    },
    {
      "exact" : {
        "fieldName" : "issue_number",
        "normalize" : false
      }
    },
    {
      "authors" : {
        "fieldName" : "author"
      }
    },
    {
      "regex" : {
        "fieldName" : "pages",
        "normalize" : true,
        "regex" : "e?0*(\\d+)",
        "compString": "$1"
      }
    }
  ],

  "heuristic": "LilacsSasHeuristicWeak",

  "reporters": [
    {
      "console": {
        "minTrue": 2
      }
    }
  ]
}
