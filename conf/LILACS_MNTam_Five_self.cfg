{
  "producer" : {
    "mysql" : {
      "host" : "osmio11.bireme.br",
      "port" : 6612,
      "dbnm" : "fi_admin",
      "user" : "acesso_fiadmin",
      "pswd" : "fi_admin@BIR202309",
      "sqlfs" : ["sqls/LILACS_MNTam.sql","sqls/LILACS_MNTam_ingles.sql"],
      "splitDocumentField" : "title",
      "jsonFieldFile" : "conf/jsonFields.txt"
    }
  },

  "selfCheckDuplicated": {
    "outCsvFile": "csv/LILACS_MNTam_Five.csv",
    "index": "indexes/LILACS_MNTam",
    "encoding": "utf-8"
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/LILACS_MNTam",
      "searchField": "title",
      "minSimilarity" : 0.85
    }
  },

  "comparators" : [
    {
      "dice" : {
        "fieldName" : "title_monographic",
        "normalize" : true,
        "minSimilarity" : 0.8
      }
    },
    {
      "exact" : {
        "fieldName" : "publication_year",
        "normalize" : true
      }
    },
    {
      "authors" : {
        "fieldName" : "author"
      }
    },
    {
      "regex" : {
        "fieldName" : "pages",
        "normalize" : true,
        "regex" : "e?(\\d+)",
        "compString": "$1"
      }
    }
  ],

  "heuristic": "LilacsMntamHeuristic",

  "reporters" : [
    {
      "pipe" : {
        "file" : "selfCheck/LILACS_MNTam/LILACS_MNTam_Five.txt",
        "encoding": "utf-8",
        "recordSeparator" : "|",
        "putHeader" : true,
        "minTrue" : 3,
        "flushResults" : true
      }
    },
    {
      "mongoDB": {
        "database" : "DeDup2",
        "collection" : "Lilacs_MNTam_Five",
        "append" : false,
        "host" : "172.17.1.230",
        "port" : 27017,
        "minTrue" : 3,
        "flushResults" : true
      }
    }
  ]
}
