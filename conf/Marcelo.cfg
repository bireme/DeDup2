{
  "producer" : {
    "csv": {
      "file": "csv/Marcelo2.csv",
      "schema" : "file=csv_schema/Marcelo.txt",
      "hasHeader": "false",
      "fieldSeparator": "|",
      "encoding": "utf-8"
    }
  },

  "finder" : {
    "lucene" : {
      "index": "indexes/Marcelo",
      "searchField": "titulo_artigo",
      "minSimilarity" : 0.85
    }
  },

  "comparators" : [
    {
      "levenshteinJaccard" : {
        "fieldName" : "titulo_revista",
        "normalize" : true,
        "minSimilarity" : 0.8
      }
    },
    {
      "exact" : {
        "fieldName" : "ano_publicacao",
        "normalize" : true
      }
    },
    {
      "exact" : {
        "fieldName" : "volume_fasciculo",
        "normalize" : false
      }
    },
    {
      "exact" : {
        "fieldName" : "numero_fasciculo",
        "normalize" : false
      }
    },
    {
      "regex" : {
        "fieldName" : "pagina_inicial",
        "normalize" : true,
        "regex" : "e?(\\d+)",
        "compString": "$1"
      }
    },
    {
      "exact" : {
        "fieldName" : "ano_publicacao",
        "normalize" : false
      }
    }
  ],

  "heuristic": "MarceloHeuristic",

  "reporters": [
    {
      "pipe": {
        "file": "saida_dup_marcelo.pipe",
        "encoding": "UTF-8",
        "recordSeparator": "\n",
        "putHeader": true,
        "minTrue": 2
      }
    }
  ]
}
